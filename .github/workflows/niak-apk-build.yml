name: Niak Cobalt — APK builder

# Full native builds use a fresh hosted VM unless a persistent cache exists.
# Don't automatically start a cold 47k-task rebuild on every CI correction.
on:
  workflow_dispatch:
    inputs:
      architecture:
        type: choice
        description: 'Android TV CPU'
        options: [arm64, arm]
        default: arm64
      compile:
        type: boolean
        description: 'Manually compile on the GitHub Ubuntu runner'
        default: false

permissions:
  contents: read

jobs:
  runner-capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect actual standard runner capacity
        shell: bash
        run: |
          set -euo pipefail
          echo "Standard GitHub runner, inspection only — no native build"
          uname -a
          free -h
          df -h "$GITHUB_WORKSPACE"
          available=$(df -Pk "$GITHUB_WORKSPACE" | awk 'END {print $4}')
          total_ram=$(awk '/MemTotal:/ {print $2}' /proc/meminfo)
          {
            echo "### Cobalt APK compilation prerequisites"
            echo ""
            echo "Disk available: $((available / 1024 / 1024)) GiB"
            echo "Memory: $((total_ram / 1024 / 1024)) GiB"
            echo ""
            echo "This probe does not build or publish any APK."
            echo "The actual public Ubuntu image has a larger volume than the minimum specification."
            echo "A native Cobalt build may now be attempted if cleanup yields sufficient free space."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify the permanent APK signer before permitting native compilation
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NIAK_COBALT_SIGNING_KEYSTORE_B64 }}
          CERT_SHA256: ${{ vars.NIAK_COBALT_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$CERT_SHA256" ]]; then
            echo "::error::Permanent signing secret or pinned certificate fingerprint is missing. No native build will run."
            exit 1
          fi
          umask 077
          keystore="$(mktemp)"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keystore"
          test -s "$keystore"
          details="$(keytool -list -v -keystore "$keystore" -storepass android -alias androiddebugkey)"
          actual="$(grep -m1 'SHA256:' <<< "$details" | cut -d: -f2- | tr -d ' :\\r\\n' | tr '[:lower:]' '[:upper:]')"
          expected="$(printf '%s' "$CERT_SHA256" | tr -d ' :\\r\\n' | tr '[:lower:]' '[:upper:]')"
          if [[ -z "$actual" || "$actual" != "$expected" ]]; then
            echo "::error::Permanent signer does not match pinned certificate fingerprint. No native build will run."
            exit 1
          fi
          echo "Permanent owner certificate verified before native build: $actual" >> "$GITHUB_STEP_SUMMARY"

  native-apk:
    needs: runner-capacity
    if: inputs.compile
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Clean unused Ubuntu SDKs and check actual space
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          echo "Before cleanup:"
          df -h "$GITHUB_WORKSPACE"
          # Cobalt fetches its own Android dependencies. Remove preinstalled
          # SDKs not used by Chromium; do not remove Java or the runner agent.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /usr/local/.ghcup /opt/hostedtoolcache/Python /opt/hostedtoolcache/Ruby
          echo "After cleanup:"
          df -h "$GITHUB_WORKSPACE"
          free_disk=$(df -Pk "$GITHUB_WORKSPACE" | awk 'END {print $4}')
          ram=$(awk '/MemTotal:/ {print $2}' /proc/meminfo)
          echo "Free disk: $((free_disk / 1024 / 1024)) GiB; RAM: $((ram / 1024 / 1024)) GiB"
          if (( free_disk < 85 * 1024 * 1024 || ram < 13 * 1024 * 1024 )); then
            echo "Insufficient disk/RAM after cleanup, aborting before full source sync"; exit 1
          fi
      - name: Install and verify native Chromium host tools
        shell: bash
        run: |
          set -euo pipefail
          # Blink's color_data.gperf rule executes gperf from PATH.
          # Ubuntu 24.04 GitHub runners do not provide it by default.
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gperf
          command -v gperf
          gperf --version
          # Fail before the expensive gclient sync if the build tool is missing.
          test -x "$(command -v gperf)"
      - uses: actions/checkout@v4
        with:
          path: cobalt/src
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
      - name: Validate requested Android ABI profile before expensive sync
        working-directory: cobalt/src
        shell: bash
        env:
          ARCH: ${{ inputs.architecture || 'arm64' }}
        run: |
          set -euo pipefail
          case "$ARCH" in arm|arm64) ;; *) echo "Unsupported architecture: $ARCH"; exit 1 ;; esac
          cfg="cobalt/build/configs/android-$ARCH/args.gn"
          test -f "$cfg"
          grep -Fxq "target_cpu = \"$ARCH\"" "$cfg"
          echo "Verified GN Android $ARCH configuration"
      - name: Require a permanent signer before any costly native compilation
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NIAK_COBALT_SIGNING_KEYSTORE_B64 }}
          CERT_SHA256: ${{ vars.NIAK_COBALT_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$CERT_SHA256" ]]; then
            echo "::error::Permanent Niak signing identity not configured. Set NIAK_COBALT_SIGNING_KEYSTORE_B64 (secret) and NIAK_COBALT_SIGNING_CERT_SHA256 (variable). Refusing a disposable certificate."
            exit 1
          fi
          echo "Owner-managed signer is configured; both ABIs must use this one certificate"
      - name: Fast Android resource preflight
        working-directory: cobalt/src
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/niak-preflight-android-resources.py
      - name: Install verified sccache 0.16.0 without fragile release-action downloads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash cobalt/src/scripts/niak-install-sccache.sh
      - name: Connect sccache to GitHub Actions cache storage
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Require reusable compiler cache before expensive sync
        shell: bash
        env:
          SCCACHE_GHA_ENABLED: 'true'
          SCCACHE_GHA_VERSION: niak-cobalt-android-qa-v1
        run: |
          set -euo pipefail
          command -v sccache
          sccache --version
          if [[ "${ACTIONS_CACHE_SERVICE_V2:-}" != on ]]; then
            echo "::error::GitHub cache V2 disabled; this would hide the existing 18k Cobalt objects"
            exit 1
          fi
          if [[ -z "${ACTIONS_RESULTS_URL:-}" || -z "${ACTIONS_RUNTIME_TOKEN:-}" ]]; then
            echo "::error::No GitHub cache backend credentials. Aborting before expensive gclient sync."
            exit 1
          fi
          echo "Content-addressed compiler cache enabled (free GitHub default quota; no storage increase requested)"
      - name: Get public depot_tools
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$GITHUB_WORKSPACE/cobalt/depot_tools"
          echo "$GITHUB_WORKSPACE/cobalt/depot_tools" >> "$GITHUB_PATH"
          # In Cobalt CI, DEPOT_TOOLS_UPDATE=0 disables the implicit bootstrap.
          # Install depot_tools' own Python before gclient/gn, as done by the
          # upstream .github/actions/depot_tools/action.yaml workflow.
          export DEPOT_TOOLS_UPDATE=0
          source "$GITHUB_WORKSPACE/cobalt/depot_tools/bootstrap_python3"
          bootstrap_python3
          test -s "$GITHUB_WORKSPACE/cobalt/depot_tools/python3_bin_reldir.txt" || {
            echo "::error::depot_tools Python bootstrap incomplete"
            exit 1
          }
      - name: Sync Cobalt and Android dependencies
        working-directory: cobalt
        shell: bash
        env:
          DEPOT_TOOLS_UPDATE: '0'
          DEPOT_TOOLS_REPORT_BUILD: '0'
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/cobalt/depot_tools:$PATH"
          gclient config --unmanaged --name=src "https://github.com/$GITHUB_REPOSITORY.git"
          printf "target_os = ['android']\n" >> .gclient
          gclient sync --nohooks --shallow --no-history --revision "$TARGET_SHA"
          gclient runhooks
          test "$(git -C src rev-parse HEAD)" = "$TARGET_SHA"
      - name: Verify and embed immutable main TizenTube userscript
        working-directory: cobalt/src
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/niak-embed-tizentube.sh
          test -s cobalt/shell/embedded_resources/cobalt_java_script_polyfill/niak_upstream_tizentube.js
          echo "TizenTube build SHA256: 9bdf8d414e1282c5ada05cae7bf4d1a53871c905c123e00e4543dbeb7c584c75" >> "$GITHUB_STEP_SUMMARY"
          echo "Pinned TizenTube main userscript included in GN source inputs"
      - name: Install and verify the same persistent owner-controlled signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NIAK_COBALT_SIGNING_KEYSTORE_B64 }}
          CERT_SHA256: ${{ vars.NIAK_COBALT_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          # Cobalt's GN/Siso configuration expects the alias androiddebugkey,
          # password android and a debug.keystore at both resolved paths.
          # These are only compatibility names; the PRIVATE KEY is a persistent
          # owner-managed GitHub Actions secret, never generated on a runner.
          keystore="$GITHUB_WORKSPACE/.android/debug.keystore"
          from_output="$GITHUB_WORKSPACE/cobalt/src/.android/debug.keystore"
          mkdir -p "$(dirname "$keystore")" "$(dirname "$from_output")"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keystore"
          test -s "$keystore"
          details="$(keytool -list -v -keystore "$keystore" -storepass android -alias androiddebugkey)"
          actual="$(grep -m1 'SHA256:' <<< "$details" | cut -d: -f2- | tr -d ' :\r\n' | tr '[:lower:]' '[:upper:]')"
          expected="$(printf '%s' "$CERT_SHA256" | tr -d ' :\r\n' | tr '[:lower:]' '[:upper:]')"
          if [[ -z "$actual" || "$actual" != "$expected" ]]; then
            echo "::error::The owner signing key does not match the pinned public certificate fingerprint"
            exit 1
          fi
          cp "$keystore" "$from_output"
          chmod 600 "$keystore" "$from_output"
          test "$(sha256sum "$keystore" | awk '{print $1}')" = "$(sha256sum "$from_output" | awk '{print $1}')"
          echo "Pinned permanent certificate verified (SHA-256): $actual" >> "$GITHUB_STEP_SUMMARY"
      - name: GN and Ninja — genuine Cobalt APK
        working-directory: cobalt/src
        shell: bash
        env:
          ARCH: ${{ inputs.architecture || 'arm64' }}
          SCCACHE_GHA_ENABLED: 'true'
          SCCACHE_GHA_VERSION: niak-cobalt-android-qa-v1
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/cobalt/depot_tools:$PATH"
          # GN uses cc_wrapper=sccache; unchanged objects are keyed by compiler
          # inputs and can be reused by future ephemeral GitHub runners.
          cobalt/build/gn.py -p "android-$ARCH" -c qa --no-rbe --use-sccache
          autoninja -j 4 -C "out/android-$ARCH"_"qa" cobalt_apk
      - name: Report compiler cache hit/miss statistics even after build failure
        if: always()
        shell: bash
        env:
          SCCACHE_GHA_ENABLED: 'true'
          SCCACHE_GHA_VERSION: niak-cobalt-android-qa-v1
        run: |
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats || true
          fi
      - name: Verify actual generated APK
        shell: bash
        env:
          ARCH: ${{ inputs.architecture || 'arm64' }}
          REVISION: ${{ github.sha }}
          CERT_SHA256: ${{ vars.NIAK_COBALT_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/cobalt/src/out/android-$ARCH"_"qa"
          mapfile -t files < <(find "$root" -maxdepth 4 -type f -name 'Cobalt.apk' -print)
          if (( ${#files[@]} != 1 )); then
            echo "Need exactly one built Cobalt.apk, got ${#files[@]}"; exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/validated-apk"
          dst="$GITHUB_WORKSPACE/validated-apk/niak-cobalt-$ARCH-${REVISION:0:12}-SIGNED-QA.apk"
          cp "${files[0]}" "$dst"
          # Fail-closed on wrong native ABI: ARM32 needs armeabi-v7a / ELF32,
          # ARM64 needs arm64-v8a / ELF64, even if the APK ZIP is otherwise valid.
          python3 "$GITHUB_WORKSPACE/cobalt/src/scripts/niak-verify-apk-abi.py" "$dst" "$ARCH"
          signer=$(command -v apksigner || find "$GITHUB_WORKSPACE/cobalt/src/third_party/android_sdk" -type f -name apksigner -print -quit)
          test -n "$signer" || { echo 'apksigner unavailable'; exit 1; }
          cert_details="$("$signer" verify --print-certs "$dst")"
          echo "$cert_details"
          actual_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "$cert_details" | head -n1 | tr -d ' :\r\n' | tr '[:lower:]' '[:upper:]')"
          expected_cert="$(printf '%s' "$CERT_SHA256" | tr -d ' :\r\n' | tr '[:lower:]' '[:upper:]')"
          if [[ -z "$actual_cert" || "$actual_cert" != "$expected_cert" ]]; then
            echo "::error::Output APK certificate differs from the pinned Niak signing identity"
            exit 1
          fi
          sha256sum "$dst" > "$dst.sha256"
          echo "Fork APK from $REVISION; stable Niak signer SHA-256 $actual_cert; not the original publisher key" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload owner-signed QA APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: niak-cobalt-${{ inputs.architecture || 'arm64' }}-${{ github.sha }}-SIGNED-QA
          path: validated-apk/
          if-no-files-found: error
          retention-days: 30
