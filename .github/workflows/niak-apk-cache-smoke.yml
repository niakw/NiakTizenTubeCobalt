name: Niak Cobalt — compiler cache smoke test

# No Cobalt source sync, GN, or native APK compilation is done here.
# This verifies that the cache can actually be reused on a fresh runner.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/niak-apk-cache-smoke.yml'
      - 'scripts/niak-install-sccache.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: niak-cobalt-cache-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  populate-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_VERSION: niak-cobalt-android-qa-v1
      # Same cache namespace reported by the successful 6-hour ARM64 build.
      # The bare installer does not set the action's hashed cache namespace.
      SCCACHE_GHA_CACHE_TO: 273b6d707536363955deed00cecdc6c2360788669f0d31a51242742f25d9a8ae
      SCCACHE_GHA_CACHE_FROM: 273b6d707536363955deed00cecdc6c2360788669f0d31a51242742f25d9a8ae
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/niak-install-sccache.sh
          sparse-checkout-cone-mode: false
      - name: Install same pinned sccache as the APK workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/niak-install-sccache.sh
      - name: Connect compiler cache to GitHub storage
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Compile one tiny stable source into the GitHub cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cache-smoke
          printf 'int niak_cache_probe(void) { return 27; }\n' > cache-smoke/probe.c
          command -v sccache
          command -v gcc
          sccache gcc -O2 -c cache-smoke/probe.c -o cache-smoke/probe.o
          test -s cache-smoke/probe.o
          sccache --show-stats

  verify-fresh-runner:
    needs: populate-cache
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_VERSION: niak-cobalt-android-qa-v1
      # Same cache namespace reported by the successful 6-hour ARM64 build.
      # The bare installer does not set the action's hashed cache namespace.
      SCCACHE_GHA_CACHE_TO: 273b6d707536363955deed00cecdc6c2360788669f0d31a51242742f25d9a8ae
      SCCACHE_GHA_CACHE_FROM: 273b6d707536363955deed00cecdc6c2360788669f0d31a51242742f25d9a8ae
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/niak-install-sccache.sh
          sparse-checkout-cone-mode: false
      - name: Install identical sccache on a different fresh runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/niak-install-sccache.sh
      - name: Connect compiler cache to GitHub storage
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Verify content-addressed cache hit across separate GitHub jobs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cache-smoke
          printf 'int niak_cache_probe(void) { return 27; }\n' > cache-smoke/probe.c
          sccache gcc -O2 -c cache-smoke/probe.c -o cache-smoke/probe.o
          test -s cache-smoke/probe.o
          stats="$(sccache --show-stats)"
          printf '%s\n' "$stats"
          hits="$(printf '%s\n' "$stats" | awk '$1=="Cache" && $2=="hits" {print $3; exit}')"
          if [[ ! "$hits" =~ ^[0-9]+$ ]] || (( hits == 0 )); then
            echo "::error::No shared cache hit on the second clean runner; cannot promise incremental Cobalt builds"
            exit 1
          fi
          {
            echo "### Compiler cache check"
            echo "Success: $hits cached compile(s) reused on a fresh runner."
            echo "Only a tiny C source was compiled; this is NOT a Cobalt/Android APK build."
          } >> "$GITHUB_STEP_SUMMARY"
