name: Niak recommendation controls checks

on:
  push:
    branches: [main]
    paths:
      - 'cobalt/shell/embedded_resources/cobalt_java_script_polyfill/niak_recommendation_controls.js'
      - 'cobalt/shell/tests/niak_recommendation_controls.test.cjs'
      - '.github/workflows/niak-recommendations.yml'
  pull_request:
    paths:
      - 'cobalt/shell/embedded_resources/cobalt_java_script_polyfill/niak_recommendation_controls.js'
      - 'cobalt/shell/tests/niak_recommendation_controls.test.cjs'
      - '.github/workflows/niak-recommendations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            cobalt/shell/embedded_resources/cobalt_java_script_polyfill
            cobalt/shell/tests
      - name: JavaScript syntax
        run: node --check cobalt/shell/embedded_resources/cobalt_java_script_polyfill/niak_recommendation_controls.js
      - name: Test YouTube TV tile and lockup contracts
        run: node --test cobalt/shell/tests/niak_recommendation_controls.test.cjs
