name: Niak Cobalt targeted checks

on:
  push:
    branches: [main]
    paths:
      - 'cobalt/shell/embedded_resources/cobalt_java_script_polyfill/**'
      - 'cobalt/shell/BUILD.gn'
      - 'cobalt/build/generate_data_header.py'
      - 'tests/*.test.cjs'
      - '.github/workflows/niak-apk-build.yml'
      - '.github/workflows/niak-apk-prerelease.yml'
      - 'scripts/niak-embed-tizentube.sh'
      - 'cobalt/shell/browser/shell.cc'
      - 'cobalt/browser/global_features*'
      - 'cobalt/android/apk/app/src/main/java/dev/cobalt/coat/CobaltActivity.java'
      - 'starboard/android/shared/video_render_algorithm_android.cc'
      - 'third_party/blink/renderer/modules/cobalt/h5vcc_runtime/h_5_vcc_runtime.cc'
      - 'third_party/blink/renderer/modules/cobalt/h5vcc_runtime/h_5_vcc_runtime.h'
      - 'third_party/blink/renderer/modules/cobalt/h5vcc_tizen_tube/h_5_vcc_tizen_tube.cc'
      - 'third_party/blink/renderer/modules/cobalt/h5vcc_tizen_tube/BUILD.gn'
      - 'cobalt/android/BUILD.gn'
      - 'cobalt/android/apk/app/src/main/java/dev/cobalt/coat/BaseStarboardBridge.java'
      - 'cobalt/android/apk/app/src/main/java/dev/cobalt/coat/CobaltUpdateActivity.java'
      - 'cobalt/android/apk/app/src/main/java/dev/cobalt/coat/UpdateDownloader.java'
      - 'cobalt/android/apk/app/src/test/java/dev/cobalt/coat/UpdateDownloaderTest.java'
      - 'cobalt/shell/android/BUILD.gn'
      - 'cobalt/shell/android/java/res/**'
      - 'scripts/niak-preflight-android-resources.py'
      - 'cobalt/shell/android/shell_apk/AndroidManifest.xml.jinja2'
      - 'cobalt/shell/android/java/res/values*/update_strings.xml'
      - '.github/workflows/niak-cobalt-filters.yml'
  pull_request:
    paths:
      - 'cobalt/shell/embedded_resources/cobalt_java_script_polyfill/**'
      - 'cobalt/shell/BUILD.gn'
      - 'tests/*.test.cjs'
      - '.github/workflows/niak-apk-build.yml'
      - '.github/workflows/niak-apk-prerelease.yml'
      - 'scripts/niak-embed-tizentube.sh'
      - 'cobalt/shell/browser/shell.cc'
      - 'cobalt/browser/global_features*'
      - 'cobalt/android/apk/app/src/main/java/dev/cobalt/coat/CobaltActivity.java'
      - 'starboard/android/shared/video_render_algorithm_android.cc'
      - 'third_party/blink/renderer/modules/cobalt/h5vcc_runtime/h_5_vcc_runtime.cc'
      - 'third_party/blink/renderer/modules/cobalt/h5vcc_runtime/h_5_vcc_runtime.h'
      - 'third_party/blink/renderer/modules/cobalt/h5vcc_tizen_tube/h_5_vcc_tizen_tube.cc'
      - 'third_party/blink/renderer/modules/cobalt/h5vcc_tizen_tube/BUILD.gn'
      - 'cobalt/android/BUILD.gn'
      - 'cobalt/android/apk/app/src/main/java/dev/cobalt/coat/BaseStarboardBridge.java'
      - 'cobalt/android/apk/app/src/main/java/dev/cobalt/coat/CobaltUpdateActivity.java'
      - 'cobalt/android/apk/app/src/main/java/dev/cobalt/coat/UpdateDownloader.java'
      - 'cobalt/android/apk/app/src/test/java/dev/cobalt/coat/UpdateDownloaderTest.java'
      - 'cobalt/shell/android/BUILD.gn'
      - 'cobalt/shell/android/java/res/**'
      - 'scripts/niak-preflight-android-resources.py'
      - 'cobalt/shell/android/shell_apk/AndroidManifest.xml.jinja2'
      - 'cobalt/shell/android/java/res/values*/update_strings.xml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  js-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            cobalt/build/generate_data_header.py
            cobalt/shell/BUILD.gn
            cobalt/shell/browser/shell.cc
            cobalt/browser/global_features.cc
            cobalt/browser/global_features.h
            cobalt/browser/global_features_unittest.cc
            cobalt/android/BUILD.gn
            cobalt/android/apk/app/src/main/java/dev/cobalt/coat/BaseStarboardBridge.java
            cobalt/android/apk/app/src/main/java/dev/cobalt/coat/CobaltActivity.java
            cobalt/android/apk/app/src/main/java/dev/cobalt/coat/CobaltUpdateActivity.java
            cobalt/android/apk/app/src/main/java/dev/cobalt/coat/UpdateDownloader.java
            cobalt/shell/android/BUILD.gn
            cobalt/shell/android/java/res
            scripts/niak-preflight-android-resources.py
            cobalt/shell/android/shell_apk/AndroidManifest.xml.jinja2
            starboard/android/shared/video_render_algorithm_android.cc
            third_party/blink/renderer/modules/cobalt/h5vcc_runtime/h_5_vcc_runtime.cc
            third_party/blink/renderer/modules/cobalt/h5vcc_runtime/h_5_vcc_runtime.h
            third_party/blink/renderer/modules/cobalt/h5vcc_tizen_tube/h_5_vcc_tizen_tube.cc
            third_party/blink/renderer/modules/cobalt/h5vcc_tizen_tube/BUILD.gn
            cobalt/shell/embedded_resources/cobalt_java_script_polyfill
            scripts/niak-embed-tizentube.sh
            tests
            .github/workflows/niak-apk-build.yml
            .github/workflows/niak-apk-prerelease.yml
          sparse-checkout-cone-mode: false
      - name: JavaScript syntax and behavior
        run: |
          node --check cobalt/shell/embedded_resources/cobalt_java_script_polyfill/niak_tizentube_filters.js
          node --check cobalt/shell/embedded_resources/cobalt_java_script_polyfill/niak_tizentube_security_guard.js
          node --test tests/*.test.cjs
      - name: Preflight Android resources against GN source declarations
        run: python3 scripts/niak-preflight-android-resources.py
      - name: Validate GN embedding header inputs
        run: |
          python3 cobalt/build/generate_data_header.py CobaltJavaScriptPolyfill /tmp/niak-embedded-js.h cobalt/shell/embedded_resources/cobalt_java_script_polyfill
          grep -q 'niak_tizentube_filters_js' /tmp/niak-embedded-js.h
          if grep -q 'niak_tizentube_filters_test_cjs' /tmp/niak-embedded-js.h; then
            echo 'Node tests must not be embedded in APK'
            exit 1
          fi

  updater-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            cobalt/android/apk/app/src/main/java/dev/cobalt/coat/UpdateDownloader.java
            cobalt/android/apk/app/src/test/java/dev/cobalt/coat/UpdateDownloaderTest.java
          sparse-checkout-cone-mode: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and run all ten upstream downloader JUnit tests
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/classes"
          curl --fail --silent --show-error --location --retry 2             https://repo.maven.apache.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar             --output "${RUNNER_TEMP}/junit.jar"
          curl --fail --silent --show-error --location --retry 2             https://repo.maven.apache.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar             --output "${RUNNER_TEMP}/hamcrest.jar"
          javac -d "${RUNNER_TEMP}/classes"             -cp "${RUNNER_TEMP}/junit.jar:${RUNNER_TEMP}/hamcrest.jar"             cobalt/android/apk/app/src/main/java/dev/cobalt/coat/UpdateDownloader.java             cobalt/android/apk/app/src/test/java/dev/cobalt/coat/UpdateDownloaderTest.java
          java -cp "${RUNNER_TEMP}/classes:${RUNNER_TEMP}/junit.jar:${RUNNER_TEMP}/hamcrest.jar"             org.junit.runner.JUnitCore dev.cobalt.coat.UpdateDownloaderTest
