name: Niak Cobalt video filters

on:
  push:
    branches: [main]
    paths:
      - 'cobalt/shell/embedded_resources/cobalt_java_script_polyfill/**'
      - 'cobalt/shell/BUILD.gn'
      - 'cobalt/build/generate_data_header.py'
      - 'tests/*.test.cjs'
      - 'cobalt/shell/browser/shell.cc'
      - 'cobalt/browser/global_features*'
      - 'cobalt/android/apk/app/src/main/java/dev/cobalt/coat/CobaltActivity.java'
      - 'starboard/android/shared/video_render_algorithm_android.cc'
      - '.github/workflows/niak-cobalt-filters.yml'
  pull_request:
    paths:
      - 'cobalt/shell/embedded_resources/cobalt_java_script_polyfill/**'
      - 'cobalt/shell/BUILD.gn'
      - 'tests/*.test.cjs'
      - 'cobalt/shell/browser/shell.cc'
      - 'cobalt/browser/global_features*'
      - 'cobalt/android/apk/app/src/main/java/dev/cobalt/coat/CobaltActivity.java'
      - 'starboard/android/shared/video_render_algorithm_android.cc'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  js-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            cobalt/build/generate_data_header.py
            cobalt/shell/BUILD.gn
            cobalt/shell/browser/shell.cc
            cobalt/browser/global_features.cc
            cobalt/browser/global_features.h
            cobalt/browser/global_features_unittest.cc
            cobalt/android/apk/app/src/main/java/dev/cobalt/coat/CobaltActivity.java
            starboard/android/shared/video_render_algorithm_android.cc
            cobalt/shell/embedded_resources/cobalt_java_script_polyfill
            tests
          sparse-checkout-cone-mode: false
      - name: JavaScript syntax and behavior
        run: |
          node --check cobalt/shell/embedded_resources/cobalt_java_script_polyfill/niak_tizentube_filters.js
          node --test tests/*.test.cjs
      - name: Validate GN embedding header inputs
        run: |
          python3 cobalt/build/generate_data_header.py CobaltJavaScriptPolyfill /tmp/niak-embedded-js.h cobalt/shell/embedded_resources/cobalt_java_script_polyfill
          grep -q 'niak_tizentube_filters_js' /tmp/niak-embedded-js.h
          if grep -q 'niak_tizentube_filters_test_cjs' /tmp/niak-embedded-js.h; then
            echo 'Node tests must not be embedded in APK'
            exit 1
          fi
