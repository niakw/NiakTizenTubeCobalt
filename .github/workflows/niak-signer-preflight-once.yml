name: Niak Cobalt — one-shot permanent APK signer preflight

# Triggered only by the initial addition of this workflow to main.
# NO Cobalt sync, APK build, release or temporary signing key.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/niak-signer-preflight-once.yml'

permissions:
  contents: read
  actions: write

jobs:
  verify-permanent-signer:
    if: github.repository == 'niakw/NiakTizenTubeCobalt'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Require existing owner-managed signer and pinned SHA-256
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NIAK_COBALT_SIGNING_KEYSTORE_B64 }}
          CERT_SHA256: ${{ vars.NIAK_COBALT_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$CERT_SHA256" ]]; then
            echo "::error::Missing persistent signing keystore secret or pinned certificate variable. Zero native builds launched."
            exit 1
          fi
          umask 077
          keystore="$(mktemp)"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keystore"
          test -s "$keystore"
          details="$(keytool -list -v -keystore "$keystore" -storepass android -alias androiddebugkey)"
          actual="$(sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' <<< "$details" | head -n1 | tr -d ' :\r\n' | tr '[:lower:]' '[:upper:]')"
          expected="$(printf '%s' "$CERT_SHA256" | tr -d ' :\r\n' | tr '[:lower:]' '[:upper:]')"
          if [[ -z "$actual" || "$actual" != "$expected" ]]; then
            echo "::error::Keystore certificate does not match the pinned fingerprint. Zero native builds launched."
            exit 1
          fi
          echo "Permanent Android APK signing certificate verified." >> "$GITHUB_STEP_SUMMARY"
          echo "Keystore alias and fixed password validated. No APK compiled and no certificate generated." >> "$GITHUB_STEP_SUMMARY"
      - name: Dispatch the two cache-backed APK jobs exactly once after validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          code_base="45e3260bacd401096367110043402e0cfb424d1d"
          tested="$(gh api "repos/$repo/actions/runs/42826168890" --jq .conclusion)"
          test "$tested" = success
          test "$(gh api "repos/$repo/actions/runs/42843467014" --jq .conclusion)" = success
          changed="$(gh api "repos/$repo/compare/$code_base...main" --jq '.files[].filename')"
          if grep -Ev '^\.github/workflows/|^tests/niak_signing_policy\.test\.cjs
            echo "::error::App code changed since targeted checks. Refusing an untested rebuild."
            exit 1
          fi
          source_sha="$(gh api "repos/$repo/git/ref/heads/main" --jq .object.sha)"
          existing="$(gh api "repos/$repo/actions/workflows/niak-apk-build.yml/runs?per_page=100&head_sha=$source_sha" --jq .total_count)"
          if (( existing > 0 )); then
            echo "::error::An APK workflow already exists for $source_sha; refusing duplicate costly builds."
            exit 1
          fi
          echo "Stable signer verified; dispatching both ABIs from the same main source commit $source_sha."
          for arch in arm arm64; do
            test "$(gh api "repos/$repo/git/ref/heads/main" --jq .object.sha)" = "$source_sha"
            gh workflow run niak-apk-build.yml --repo "$repo" --ref main -f "architecture=$arch" -f compile=true
            echo "Dispatched owner-signed $arch APK with existing sccache." >> "$GITHUB_STEP_SUMMARY"
          done
          echo "Source revision: $source_sha. No temporary signing certificates." >> "$GITHUB_STEP_SUMMARY"
 <<< "$changed" | grep -q .; then
            echo "::error::App code changed since targeted checks. Refusing an untested rebuild."
            exit 1
          fi
          source_sha="$(gh api "repos/$repo/git/ref/heads/main" --jq .object.sha)"
          existing="$(gh api "repos/$repo/actions/workflows/niak-apk-build.yml/runs?per_page=100&head_sha=$source_sha" --jq .total_count)"
          if (( existing > 0 )); then
            echo "::error::An APK workflow already exists for $source_sha; refusing duplicate costly builds."
            exit 1
          fi
          echo "Stable signer verified; dispatching both ABIs from the same main source commit $source_sha."
          for arch in arm arm64; do
            test "$(gh api "repos/$repo/git/ref/heads/main" --jq .object.sha)" = "$source_sha"
            gh workflow run niak-apk-build.yml --repo "$repo" --ref main -f "architecture=$arch" -f compile=true
            echo "Dispatched owner-signed $arch APK with existing sccache." >> "$GITHUB_STEP_SUMMARY"
          done
          echo "Source revision: $source_sha. No temporary signing certificates." >> "$GITHUB_STEP_SUMMARY"
