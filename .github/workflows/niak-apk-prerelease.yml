name: Niak Cobalt — owner-signed QA APK prerelease

on:
  workflow_run:
    workflows: ['Niak Cobalt — APK builder']
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  publish-signed-qa:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/niak-embed-tizentube.sh
            scripts/niak-verify-apk-abi.py
            cobalt/shell/BUILD.gn
            cobalt/shell/browser/shell.cc
            .github/workflows/niak-apk-build.yml
          sparse-checkout-cone-mode: false
      - name: Refuse a release without pinned main userscript and security guard
        id: provenance
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '9bdf8d414e1282c5ada05cae7bf4d1a53871c905c123e00e4543dbeb7c584c75' scripts/niak-embed-tizentube.sh \
              && grep -q 'niak_upstream_tizentube.js' cobalt/shell/BUILD.gn \
              && grep -q 'niak_tizentube_security_guard.js' cobalt/shell/BUILD.gn \
              && grep -q 'niak_upstream_tizentube.js' cobalt/shell/browser/shell.cc \
              && grep -q 'NIAK_COBALT_SIGNING_KEYSTORE_B64' .github/workflows/niak-apk-build.yml \
              && ! grep -q 'keytool -genkeypair' .github/workflows/niak-apk-build.yml; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Skipping release: exact build commit predates security requirements" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Download genuine signed APK artifact
        if: steps.provenance.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/apks"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern 'niak-cobalt-*-SIGNED-QA' --dir "$GITHUB_WORKSPACE/apks"
          mapfile -t apks < <(find "$GITHUB_WORKSPACE/apks" -type f -name '*-SIGNED-QA.apk')
          (( ${#apks[@]} == 1 )) || { echo 'Expected exactly one genuine signed QA APK'; exit 1; }
          test "$(stat -c '%s' "${apks[0]}")" -gt 10000000
          test -f "${apks[0]}.sha256"
          expected=$(awk '{print $1}' "${apks[0]}.sha256")
          actual=$(sha256sum "${apks[0]}" | awk '{print $1}')
          test "$actual" = "$expected" || { echo 'APK SHA mismatch'; exit 1; }
          unzip -t "${apks[0]}" | tail -1
          # Validate native ELF class and ABI from APK, independently of build logs.
          case "$(basename "${apks[0]}")" in
            niak-cobalt-arm64-*-SIGNED-QA.apk) arch=arm64 ;;
            niak-cobalt-arm-*-SIGNED-QA.apk) arch=arm ;;
            *) echo "Unknown APK architecture naming"; exit 1 ;;
          esac
          python3 scripts/niak-verify-apk-abi.py "${apks[0]}" "$arch"
          echo "Artifact SHA-256 and native $arch ABI verified: $actual"
      - name: Publish owner-signed QA prerelease only
        if: steps.provenance.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          short="${SOURCE_SHA:0:12}"
          tag="niak-cobalt-signed-qa-$RUN_ID"
          mapfile -t files < <(find "$GITHUB_WORKSPACE/apks" -type f \( -name '*-SIGNED-QA.apk' -o -name '*-SIGNED-QA.apk.sha256' \))
          (( ${#files[@]} == 2 )) || exit 1
          gh release create "$tag" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Niak Cobalt Android signed QA — $short" \
            --prerelease \
            --notes "OWNER-SIGNED QA BUILD (not yet device-validated). Exact source revision: $SOURCE_SHA, successful run $RUN_ID (the tag may reference workflow revision $GITHUB_SHA for GitHub token compatibility). The APK was compiled with the single permanent Niak signing key stored in a GitHub Actions secret, pinned to a public certificate SHA-256 fingerprint; ABI, binary digest and APK signer were verified at build. Subsequent Niak-signed APKs with this same certificate can update in place if Android versionCode allows. This is NOT the original TizenTube publisher signature, and cannot update official or earlier ephemeral TEST APKs without reinstallation. Real Android TV navigation, login and playback still require physical validation."
