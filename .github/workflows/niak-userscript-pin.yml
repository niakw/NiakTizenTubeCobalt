name: Niak TizenTube pinned userscript verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/niak-userscript-pin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Build upstream TizenTube JS at exact audited Git commit
        shell: bash
        env:
          SOURCE_SHA: f99945a84ff767bf14ad8c1146e8e3fd49a3d628
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/reisxd/TizenTube.git upstream-tizentube
          git -C upstream-tizentube fetch --depth=1 origin "$SOURCE_SHA"
          git -C upstream-tizentube checkout --detach "$SOURCE_SHA"
          test "$(git -C upstream-tizentube rev-parse HEAD)" = "$SOURCE_SHA"
          cd upstream-tizentube/mods
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          test -s ../dist/userScript.js
          node --check ../dist/userScript.js
          sha256sum ../dist/userScript.js
          echo "TizenTube source commit: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Bundled source SHA-256:" >> "$GITHUB_STEP_SUMMARY"
          sha256sum ../dist/userScript.js >> "$GITHUB_STEP_SUMMARY"
      - name: Upload compiled script and provenance for APK embedding
        uses: actions/upload-artifact@v4
        with:
          name: pinned-tizentube-script
          path: upstream-tizentube/dist/userScript.js
          retention-days: 14
          if-no-files-found: error
